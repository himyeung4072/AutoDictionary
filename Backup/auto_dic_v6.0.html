    // 載入設定從 localStorage
    function loadSettings() {
        const saved = localStorage.getItem('dictationSettings');
        if (!saved) return;
        
        try {
            const settings = JSON.parse(saved);
            if (settings.lang) {
                document.getElementById('langSelect').value = settings.lang;
                // Update language tabs
                const langTabs = document.querySelectorAll('.lang-tab');
                langTabs.forEach(tab => {
                    if (tab.getAttribute('data-lang') === settings.lang) {
                        tab.classList.add('active');

                        tab.setAttribute('tabindex', '0');
                    } else {
                        tab.classList.remove('active');
                        tab.setAttribute('aria-selected', 'false');
                        tab.setAttribute('tabindex', '-1');
                    }
                });
            }
            if (settings.mode) {
                // Update hidden radio button
                const modeRadio = document.getElementById('mode' + settings.mode.charAt(0).toUpperCase() + settings.mode.slice(1));
                if (modeRadio) {
                    modeRadio.checked = true;
                }
                // Update mode tabs UI
                const modeTabs = document.querySelectorAll('.mode-tab');
                modeTabs.forEach(tab => {
                    if (tab.getAttribute('data-mode') === settings.mode) {
                        tab.classList.add('active');
                        tab.setAttribute('aria-selected', 'true');
                        tab.setAttribute('tabindex', '0');
                    } else {
                        tab.classList.remove('active');
                        tab.setAttribute('aria-selected', 'false');
                        tab.setAttribute('tabindex', '-1');
                    }
                });
                // Update tab indicator position
                const activeTab = document.querySelector('.mode-tab.active');
                const indicator = document.querySelector('.mode-tabs .tab-indicator');
                if (activeTab && indicator) {
                    indicator.style.transition = 'none';

            if (settings.wordSpeechRate) {

            if (settings.repeatCount) {

            }
            if (settings.interval !== undefined) {
                document.getElementById('interval').value = settings.interval;

            }
            if (settings.speechRate) {
                document.getElementById('speechRate').value = settings.speechRate;
                updateSegmentedControl('articleSpeedSegments', settings.speechRate);
            }
            if (settings.sentenceRepeat) {
                document.getElementById('sentenceRepeat').value = settings.sentenceRepeat;
                updateSegmentedControl('sentenceRepeatSegments', settings.sentenceRepeat);
            }
            if (settings.charWaitTime !== undefined) {
                document.getElementById('charWaitTime').value = settings.charWaitTime;
                updateSegmentedControl('charWaitTimeSegments', settings.charWaitTime);
            }
            
            // Load settings panel state (Requirement 4.6)
            if (settings.settingsPanelOpen !== undefined) {
                const settingsPanel = document.getElementById('settingsPanel');
                if (settingsPanel) {
                    settingsPanel.open = settings.settingsPanelOpen;
                }
            }
            
            // Load debug visibility (Requirement 8.4)
            if (settings.debugVisible !== undefined) {
                const debugSection = document.getElementById('debugSection');
                if (debugSection) {
                    debugSection.style.display = settings.debugVisible ? 'block' : 'none';
                }
            }
            
            // 載入 textarea 內容

                const textarea = document.getElementById('words');
                if (textarea) {
                    textarea.value = settings.textContent;
                    autoExpandTextarea(textarea);

                        voiceSelect.value = settings.voice;
                    }
                }, 500);
            }
        } catch (e) {
            console.error('載入設定失敗:', e);
        }

    }

    // Mode tab click handlers
    function initModeTabs() {
        const tabsContainer = document.querySelector('.mode-tabs');
        const tabs = tabsContainer.querySelectorAll('.mode-tab');
        
        // Create sliding indicator
        const indicator = document.createElement('div');
        indicator.className = 'tab-indicator';
        tabsContainer.appendChild(indicator);
        
        // Position indicator on active tab
        function updateIndicator(activeTab, animate = true) {
            if (!animate) {
                indicator.style.transition = 'none';
            }
            indicator.style.left = activeTab.offsetLeft + 'px';
            indicator.style.width = activeTab.offsetWidth + 'px';
            if (!animate) {
                // Force reflow then restore transition
                indicator.offsetHeight;
                indicator.style.transition = '';
            }
        }
        
        // Initialize indicator position
        const initialActive = tabsContainer.querySelector('.mode-tab.active');
        if (initialActive) {
            updateIndicator(initialActive, false);
        }
        
        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                const mode = this.getAttribute('data-mode');
                // Update hidden radio button
                document.getElementById('mode' + mode.charAt(0).toUpperCase() + mode.slice(1)).checked = true;
                
                // Update active states
                tabs.forEach(t => {
                    t.classList.remove('active');
                    t.setAttribute('aria-selected', 'false');
                    t.setAttribute('tabindex', '-1');
                });
                this.classList.add('active');
                this.setAttribute('aria-selected', 'true');
                this.setAttribute('tabindex', '0');
                
                // Animate indicator
                updateIndicator(this);
                
                toggleMode();
                saveSettings();
            });
            
            // Keyboard navigation for accessibility
            tab.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                    e.preventDefault();
                    const tabsArr = Array.from(tabs);
                    const currentIndex = tabsArr.indexOf(this);
                    let newIndex;
                    
                    if (e.key === 'ArrowRight') {
                        newIndex = (currentIndex + 1) % tabsArr.length;
                    } else {
                        newIndex = (currentIndex - 1 + tabsArr.length) % tabsArr.length;
                    }
                    
                    tabsArr[newIndex].click();
                    tabsArr[newIndex].focus();
                }
            });
        });
        
        // Update indicator on window resize
        window.addEventListener('resize', () => {
            const activeTab = tabsContainer.querySelector('.mode-tab.active');
            if (activeTab) {
                updateIndicator(activeTab, false);
            }
        });
    }

    /**
     * 觸發觸覺反饋
     * @param {string} type - 反饋類型: 'light', 'medium', 'heavy'
     */
    function triggerHaptic(type = 'light') {
        if (!navigator.vibrate) return;
        
        const patterns = {
            light: 10,    // 輕微震動
            medium: 25,   // 中等震動
            heavy: 50     // 強烈震動
        };
        
        try {
            navigator.vibrate(patterns[type] || patterns.light);
        } catch (e) {
            // 靜默失敗，某些瀏覽器可能不支援
        }
    }

        buttons.forEach(btn => {

            );
            
            // Space 鍵：開始/暫停（排除輸入框焦點）

            // Escape 鍵：停止
            if (e.code === 'Escape') {

                }

    // ==================== 輸入驗證與 XSS 防護 ====================
    // Requirements 9.1, 9.2, 9.3
    
    /**
     * 清理用戶輸入，移除潛在的 HTML 標籤
     * @param {string} text - 用戶輸入的文字
     * @returns {string} 清理後的純文字
     */
    function sanitizeInput(text) {
        if (!text || typeof text !== 'string') return '';
        // 使用 DOM 解析來安全地提取純文字內容
        const div = document.createElement('div');
        div.innerHTML = text;
        return div.textContent || div.innerText || '';
    }
    
    // ==================== 文字語言驗證 (Text Language Validation) ====================
    // Requirements 1.1, 1.2, 1.3, 1.4, 2.1, 2.2, 2.3, 2.4, 3.1, 3.2, 3.3, 3.4
    
    /**
     * 檢查文字是否包含中文字符
     * @param {string} text - 要檢查的文字
     * @returns {boolean} - 是否包含中文字符
     */
    function containsChinese(text) {
        // 使用 Unicode 範圍檢測中文字符
        // CJK Unified Ideographs: \u4e00-\u9fff
        // CJK Unified Ideographs Extension A: \u3400-\u4dbf
        // CJK Compatibility Ideographs: \uf900-\ufaff
        const chineseRegex = /[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff]/;
        return chineseRegex.test(text);
    }
    
    /**
     * 檢查文字是否為純英文（不含中文）
     * @param {string} text - 要檢查的文字
     * @returns {boolean} - 是否為純英文
     */
    function isEnglishOnly(text) {
        // 移除空白字符後檢查是否包含中文
        const trimmedText = text.replace(/\s/g, '');
        if (trimmedText === '') return true; // 空白由其他邏輯處理
        return !containsChinese(text);
    }
    
    /**
     * 根據語言驗證文字
     * @param {string} text - 輸入文字
     * @param {string} lang - 語言代碼 ('zh-HK', 'zh-CN', 'en-GB')
     * @returns {{valid: boolean, errorMessage: string|null}}
     */
    function validateTextForLanguage(text, lang) {
        // 移除空白字符進行驗證
        const trimmedText = text.replace(/\s/g, '');
        
        // 空白文字由現有邏輯處理
        if (trimmedText === '') {
            return { valid: true, errorMessage: null };
        }
        
        if (lang === 'zh-HK') {
            if (!containsChinese(text)) {
                return { 
                    valid: false, 
                    errorMessage: '粵語模式請輸入中文文字' 
                };
            }
        } else if (lang === 'zh-CN') {
            if (!containsChinese(text)) {
                return { 
                    valid: false, 
                    errorMessage: '普通話模式請輸入中文文字' 
                };
            }
        } else if (lang === 'en-GB') {
            if (containsChinese(text)) {
                return { 
                    valid: false, 
                    errorMessage: '英語模式請輸入英文文字' 
                };
            }
        }
        
        return { valid: true, errorMessage: null };
    }

    // ==================== 防抖處理 (Debounce) ====================
    // Requirements 14.1, 14.2, 14.3
    
    /**
     * 通用防抖函數
     * @param {Function} func - 要防抖的函數
     * @param {number} wait - 等待時間（毫秒）
     * @returns {Function} 防抖後的函數
     */
    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func.apply(this, args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }

    // ==================== 滑動手勢支援 ====================
    
    /**
     * 初始化滑動手勢切換模式
     */
    function initSwipeGestures() {
        const modeTabsContainer = document.querySelector('.mode-tabs');
        if (!modeTabsContainer) return;
        
        let touchStartX = 0;
        let touchEndX = 0;
        const minSwipeDistance = 50; // 最小滑動距離
        
        modeTabsContainer.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        
        modeTabsContainer.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleModeSwipe();
        }, { passive: true });
        
        function handleModeSwipe() {
            const swipeDistance = touchEndX - touchStartX;
            
            if (Math.abs(swipeDistance) < minSwipeDistance) return;
            
            const currentMode = document.querySelector('input[name="mode"]:checked').value;
            let newMode;
            
            if (swipeDistance > 0) {
                // 向右滑動 → 切換到「讀詞語」
                newMode = 'word';
            } else {
                // 向左滑動 → 切換到「讀文章」
                newMode = 'article';
            }
            
            if (newMode !== currentMode) {
                // 更新隱藏的 radio button
                document.getElementById('mode' + newMode.charAt(0).toUpperCase() + newMode.slice(1)).checked = true;
                toggleMode();
                saveSettings();
                triggerHaptic('medium'); // 切換時觸發中等反饋
            }
        }
        
        // 同樣為語言 Tab 添加滑動支援
        const langTabsContainer = document.querySelector('.lang-tabs');
        if (!langTabsContainer) return;
        
        let langTouchStartX = 0;
        let langTouchEndX = 0;
        
        langTabsContainer.addEventListener('touchstart', (e) => {
            langTouchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        
        langTabsContainer.addEventListener('touchend', (e) => {
            langTouchEndX = e.changedTouches[0].screenX;
            handleLangSwipe();
        }, { passive: true });
        
        function handleLangSwipe() {
            const swipeDistance = langTouchEndX - langTouchStartX;
            
            if (Math.abs(swipeDistance) < minSwipeDistance) return;
            
            const langTabs = Array.from(document.querySelectorAll('.lang-tab'));
            const currentLang = document.getElementById('langSelect').value;
            const currentIndex = langTabs.findIndex(tab => tab.getAttribute('data-lang') === currentLang);
            
            let newIndex;
            if (swipeDistance > 0) {
                // 向右滑動 → 上一個語言
                newIndex = Math.max(0, currentIndex - 1);
            } else {
                // 向左滑動 → 下一個語言
                newIndex = Math.min(langTabs.length - 1, currentIndex + 1);
            }
            
            if (newIndex !== currentIndex) {
                langTabs[newIndex].click();
                triggerHaptic('medium');
            }
        }
    }
    
    document.addEventListener('DOMContentLoaded', initSwipeGestures);

    // 載入可用聲音（含重試機制）
    let voiceLoadRetries = 0;
    const maxVoiceRetries = 10;
    
    function loadVoices() {
        const loadingSpinner = document.getElementById('voiceLoading');
        
        // 顯示載入指示器
        if (loadingSpinner) {
            loadingSpinner.setAttribute('aria-hidden', 'false');
        }
        
        availableVoices = synth.getVoices();
        if (availableVoices.length === 0 && voiceLoadRetries < maxVoiceRetries) {
            voiceLoadRetries++;
            setTimeout(loadVoices, 200);
            return;
        }
        
        // 隱藏載入指示器
        if (loadingSpinner) {
            loadingSpinner.setAttribute('aria-hidden', 'true');
        }
        
        updateVoiceOptions();
    }

    // 檢測是否為 iOS 設備
    function isIOS() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) || 
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    // 更新聲音選項
    function updateVoiceOptions() {
        const langSelect = document.getElementById('langSelect');
        const voiceSelect = document.getElementById('voiceSelect');
        const selectedLang = langSelect.value;
        
        // iOS 26 workaround: 不使用「自動」，直接列出可用語音
        // 因為 iOS 26 會忽略 voice 設定，使用系統預設語音
        const isiOSDevice = isIOS();
        
        if (isiOSDevice) {
            voiceSelect.innerHTML = ''; // iOS 上不提供「自動」選項
        } else {
            voiceSelect.innerHTML = '<option value="auto">自動</option>';
        }
        
        // 根據選擇的語言過濾語音
        let filteredVoices = [];
        
        if (selectedLang === 'zh-HK') {
            // 粵語：iOS 上是 yue-HK
            filteredVoices = availableVoices.filter(voice => 
                voice.lang === 'yue-HK' || 
                voice.lang.includes('yue') ||
                (voice.lang.includes('HK') && !voice.lang.startsWith('en'))
            );
        } else if (selectedLang === 'zh-CN') {
            // 普通話：zh-CN，排除 yue 和 TW
            filteredVoices = availableVoices.filter(voice => 
                voice.lang === 'zh-CN' ||
                (voice.lang.startsWith('zh') && 
                 !voice.lang.includes('yue') && 
                 !voice.lang.includes('TW') &&
                 !voice.lang.includes('HK'))
            );
        } else {
            // 其他語言：按語言前綴過濾
            const langPrefix = selectedLang.split('-')[0];
            filteredVoices = availableVoices.filter(voice => 
                voice.lang.startsWith(langPrefix)
            );
        }
        
        // iOS 26 workaround: 去重複（iOS 可能返回重複的語音）
        const uniqueVoices = [];
        const seenNames = new Set();
        filteredVoices.forEach(voice => {
            if (!seenNames.has(voice.name)) {
                seenNames.add(voice.name);
                uniqueVoices.push(voice);
            }
        });
        
        uniqueVoices.forEach((voice, index) => {
            const option = document.createElement('option');
            option.value = voice.name;
            
            // 識別語音類型
            let label = voice.name;
            const voiceLang = voice.lang.toLowerCase();
            
            // 標記語言類型
            if (voiceLang.includes('yue') || voiceLang === 'zh-hk') {
                label += ' (粵語)';
            } else if (voiceLang === 'zh-cn') {
                label += ' (普通話)';
            } else if (voiceLang === 'zh-tw') {
                label += ' (台灣)';
            }
            
            option.textContent = label;
            voiceSelect.appendChild(option);
        });
        
        // iOS 26 workaround: 如果沒有選項，添加一個提示
        if (voiceSelect.options.length === 0) {
            const option = document.createElement('option');
            option.value = 'auto';
            option.textContent = '無可用語音';
            voiceSelect.appendChild(option);
        }
        
        // iOS: 顯示提示信息
        updateiOSHint();
    }

    // 開始倒數計時（從朗讀開始時就顯示）
    function startCountdown(totalMs, startTime) {
        const timer = setInterval(() => {
            if (isStopped) {
                clearInterval(timer);
                return;
            }
            if (!isPaused) {
                const elapsed = Date.now() - startTime;
                const remaining = Math.ceil((totalMs - elapsed) / 1000);
                if (remaining > 0) {
                    updateStatus(document.getElementById('statusReading').textContent, `等待中 ${remaining}秒`);
                } else {
                    clearInterval(timer);
                    updateStatus(document.getElementById('statusReading').textContent, '');
                }
            }
        }, 100);
        return timer;
    }

    // 等待剩餘時間（使用已存在的倒數計時器）
    function waitRemaining(ms, countdownTimer) {
        return new Promise(resolve => {
            if (skipNextWait || ms <= 0) {
                skipNextWait = false;
                clearInterval(countdownTimer);
                updateStatus(document.getElementById('statusReading').textContent, '');
                resolve();
                return;
            }
            
            const start = Date.now();
            const timer = setInterval(() => {
                if (isStopped) {
                    clearInterval(timer);
                    clearInterval(countdownTimer);
                    resolve();
                } else if (isPaused) {
                    clearInterval(timer);
                    clearInterval(countdownTimer);
                    skipNextWait = true;
                    const waitResume = setInterval(() => {
                        if (isStopped || !isPaused) {
                            clearInterval(waitResume);
                            resolve();
                        }
                    }, 200);
                } else {
                    const elapsed = Date.now() - start;
                    if (elapsed >= ms) {
                        clearInterval(timer);
                        clearInterval(countdownTimer);
                        updateStatus(document.getElementById('statusReading').textContent, '');
                        resolve();
                    }
                }
            }, 100);
        });
    }

    // 核心等待函數：支援暫停檢查和間隔計時，並顯示倒數
    function wait(ms, showCountdown = false) {
        return new Promise(resolve => {
            // 如果需要跳過等待，直接返回
            if (skipNextWait) {
                skipNextWait = false;
                resolve();
                return;
            }
            
            const start = Date.now();
            const timer = setInterval(() => {
                if (isStopped) {
                    clearInterval(timer);
                    resolve();
                } else if (isPaused) {
                    // 暫停時停止計時，恢復後跳過剩餘等待
                    clearInterval(timer);
                    skipNextWait = true;
                    // 等待恢復
                    const waitResume = setInterval(() => {
                        if (isStopped || !isPaused) {
                            clearInterval(waitResume);
                            resolve();
                        }
                    }, 200);
                } else if (!isPaused) {
                    const elapsed = Date.now() - start;
                    if (elapsed >= ms) {
                        clearInterval(timer);
                        updateStatus(document.getElementById('statusReading').textContent, '');
                        resolve();
                    } else if (showCountdown) {
                        const remaining = Math.ceil((ms - elapsed) / 1000);
                        updateStatus(document.getElementById('statusReading').textContent, `等待中 ${remaining}秒`);
                    }
                }
            }, 100);
            window.currentTimer = timer;
        });
    }

    // 分割文章為句子（在標點符號和引號處分割）
    function splitIntoSentences(text) {
        // 包含所有需要分割的標點符號，包括引號
        const punctuationPattern = /([。！？；，、．.!?;,：:「」""''（）\(\)])/g;
        const parts = text.split(punctuationPattern).filter(s => s !== '');
        
        const sentences = [];
        let currentSentence = '';
        
        for (let i = 0; i < parts.length; i++) {
            const part = parts[i];
            
            // 檢查是否為標點符號
            if (/^[。！？；，、．.!?;,：:「」""''（）\(\)]$/.test(part)) {
                // 將標點符號加到當前句子
                currentSentence += part;
                
                // 在這些標點符號後分割句子
                if (currentSentence.trim() !== '') {
                    sentences.push(currentSentence.trim());
                    currentSentence = '';
                }
            } else {
                // 普通文字
                currentSentence += part;
            }
        }
        
        // 處理最後剩餘的文字
        if (currentSentence.trim() !== '') {
            sentences.push(currentSentence.trim());
        }
        
        return sentences;
    }

    // 計算等待時間
    function calculateWaitTime(sentence, lang) {
        const rawValue = parseFloat(document.getElementById('charWaitTime').value);
        const charWaitTime = isNaN(rawValue) ? 3 : Math.max(0, rawValue);
        if (lang.startsWith('zh')) {
            const charCount = (sentence.match(/[\u4e00-\u9fff\u3400-\u4dbf]/g) || []).length;
            const count = charCount > 0 ? charCount : sentence.length;
            return count * charWaitTime * 1000;
        } else {
            const wordCount = sentence.split(/\s+/).filter(w => w.length > 0).length;
            const count = wordCount > 0 ? wordCount : 1;
            return count * charWaitTime * 1000;
        }
    }

    // 計算詞語等待時間（讀詞語模式使用）
    function calculateWordWaitTime(word, lang, charWaitTime) {
        if (lang.startsWith('zh')) {
            // 中文：計算漢字數量
            const charCount = (word.match(/[\u4e00-\u9fff\u3400-\u4dbf]/g) || []).length;
            const count = charCount > 0 ? charCount : word.length;
            return count * charWaitTime * 1000;
        } else {
            // 英文：計算單詞數量
            const wordCount = word.split(/\s+/).filter(w => w.length > 0).length;
            const count = wordCount > 0 ? wordCount : 1;
            return count * charWaitTime * 1000;
        }
    }

    async function startReading() {
        const mode = document.querySelector('input[name="mode"]:checked').value;
        const rawText = document.getElementById('words').value;
        const text = sanitizeInput(rawText); // XSS 防護
        const lang = document.getElementById('langSelect').value;
        const selectedVoice = document.getElementById('voiceSelect').value;
        
        // 空狀態處理 - Requirements 15.1, 15.2, 15.3, 15.4
        if (text.trim() === '') {
            updateStatus('請先輸入內容', '');
            const textarea = document.getElementById('words');
            textarea.focus();
            textarea.classList.add('input-error');
            setTimeout(() => textarea.classList.remove('input-error'), 2000);
            return;
        }

        // 語言驗證 - Requirements 1.3, 2.3, 3.3, 4.1, 4.3
        const validation = validateTextForLanguage(text, lang);
        if (!validation.valid) {
            showErrorToast(validation.errorMessage);
            const textarea = document.getElementById('words');
            textarea.focus();
            textarea.classList.add('input-error');
            setTimeout(() => textarea.classList.remove('input-error'), 2000);
            return;
        }

        isStopped = false;
        isPaused = false;
        setButtonsState(true);

        // Reset progress at start
        resetProgress();
        
        // 切換到顯示模式，啟用高亮功能 - Requirements 6.2
        const highlightMode = mode === 'word' ? 'word' : 'article';
        HighlightManager.switchToDisplayMode(text, highlightMode);

        try {
            if (mode === 'word') {
                await readWords(text, lang, selectedVoice);
            } else {
                await readArticle(text, lang, selectedVoice);
            }

            if (!isStopped) {
                updateStatus("播放完畢", '');
            }
        } catch (error) {
            console.error('朗讀過程發生錯誤:', error);
            updateStatus('發生錯誤，請重試', '');
            showErrorToast('語音功能暫時無法使用，請檢查瀏覽器設定');
            resetButtons();
        }
        resetButtons();
        
        // 朗讀結束後切換回編輯模式 - Requirements 4.1, 6.3
        HighlightManager.switchToEditMode();
    }

    async function readWords(text, lang, selectedVoice) {
        const speechRate = parseFloat(document.getElementById('wordSpeechRate').value) || 0.9;
        const repeatPerLine = Math.max(1, parseInt(document.getElementById('repeatCount').value) || 1);
        const charWaitTime = Math.max(0, parseFloat(document.getElementById('interval').value) || 0);
        
        const lines = text.split('\n').map(s => s.trim()).filter(s => s !== "");
        if (lines.length === 0) return;

        // 先計算每個詞語的時間和總時間（等待時間已包含朗讀時間）
        const wordTimes = lines.map(line => {
            const waitTime = calculateWordWaitTime(line, lang, charWaitTime);
            return waitTime; // 總時間 = 等待時間 × 重複次數（但等待時間已包含朗讀）
        });
        const totalTime = wordTimes.reduce((sum, t) => sum + t, 0);
        
        // 計算每個詞語的進度區間（根據時間佔比）
        let accumulatedPercent = 0;
        const progressRanges = wordTimes.map(time => {
            const start = accumulatedPercent;
            const percent = (time / totalTime) * 100;
            accumulatedPercent += percent;
            return { start, end: accumulatedPercent, duration: time };
        });

        for (let lineIdx = 0; lineIdx < lines.length; lineIdx++) {
            const line = lines[lineIdx];
            if (isStopped) break;

            const { start, end, duration } = progressRanges[lineIdx];
            const waitTime = calculateWordWaitTime(line, lang, charWaitTime);
            const waitPerRepeat = waitTime / repeatPerLine;
            
            // 更新狀態列文字
            const statusCount = document.getElementById('statusCount');
            if (statusCount) {
                statusCount.textContent = `詞語 ${lineIdx + 1}/${lines.length} 個`;
            }
            
            // 漸進式進度條：根據時間佔比分配區間
            animateProgressFromTo(start, end, duration);
            
            // 高亮當前詞語 - Requirements 2.1, 4.4
            HighlightManager.highlightItem(lineIdx);

            for (let i = 1; i <= repeatPerLine; i++) {
                if (isStopped) break;

                // 記錄開始時間，朗讀時間包含在等待時間內
                const repeatStartTime = Date.now();
                
                // 開始倒數計時（朗讀開始時就顯示）
                const countdownTimer = startCountdown(waitPerRepeat, repeatStartTime);

                // 如果上一次被中斷，需要重新朗讀
                do {
                    wasInterrupted = false;
                    updateStatus(`正在朗讀：${line} (${i}/${repeatPerLine})`, '');
                    await speakPromise(line, lang, selectedVoice, speechRate);
                    
                    // 如果被中斷，等待恢復
                    while (isPaused && !isStopped) {
                        await new Promise(r => setTimeout(r, 200));
                    }
                } while (wasInterrupted && !isStopped);
                
                // 重讀完成後重置跳過等待標記，確保後續正常等待
                skipNextWait = false;

                // 計算剩餘等待時間（等待時間 - 已用朗讀時間）
                const elapsedTime = Date.now() - repeatStartTime;
                const remainingWait = Math.max(0, waitPerRepeat - elapsedTime);

                // 如果還有剩餘時間且不是最後一詞的最後一次，則等待
                if (!isStopped && remainingWait > 0 && !(lineIdx === lines.length - 1 && i === repeatPerLine)) {
                    await waitRemaining(remainingWait, countdownTimer);
                } else {
                    clearInterval(countdownTimer);
                    updateStatus(document.getElementById('statusReading').textContent, '');
                }
            }
        }
        
        // 確保最後進度條到達 100%
        stopProgressAnimation();
        const progressFill = document.getElementById('progressFill');
        if (progressFill) progressFill.style.width = '100%';
    }

    async function readArticle(text, lang, selectedVoice) {
        const speechRate = parseFloat(document.getElementById('speechRate').value) || 0.9;
        const sentenceRepeat = Math.max(1, parseInt(document.getElementById('sentenceRepeat').value) || 1);
        
        const sentences = splitIntoSentences(text);
        if (sentences.length === 0) return;

        // 先計算每個句子的時間和總時間（等待時間已包含朗讀時間）
        const sentenceTimes = sentences.map(sentence => {
            const waitTime = calculateWaitTime(sentence, lang);
            return waitTime; // 總時間 = 等待時間（已包含朗讀）
        });
        const totalTime = sentenceTimes.reduce((sum, t) => sum + t, 0);
        
        // 計算每個句子的進度區間（根據時間佔比）
        let accumulatedPercent = 0;
        const progressRanges = sentenceTimes.map(time => {
            const start = accumulatedPercent;
            const percent = (time / totalTime) * 100;
            accumulatedPercent += percent;
            return { start, end: accumulatedPercent, duration: time };
        });

        for (let idx = 0; idx < sentences.length; idx++) {
            const sentence = sentences[idx];
            if (isStopped) break;

            const { start, end, duration } = progressRanges[idx];
            const totalWaitTime = calculateWaitTime(sentence, lang);
            const waitPerRepeat = totalWaitTime / sentenceRepeat;
            
            // 更新狀態列文字
            const statusCount = document.getElementById('statusCount');
            if (statusCount) {
                statusCount.textContent = `句子 ${idx + 1}/${sentences.length} 個`;
            }
            
            // 漸進式進度條：根據時間佔比分配區間
            animateProgressFromTo(start, end, duration);
            
            // 高亮當前句子 - Requirements 2.1, 4.4
            HighlightManager.highlightItem(idx);

            for (let i = 1; i <= sentenceRepeat; i++) {
                if (isStopped) break;

                // 記錄開始時間，朗讀時間包含在等待時間內
                const repeatStartTime = Date.now();
                
                // 開始倒數計時（朗讀開始時就顯示）
                const countdownTimer = startCountdown(waitPerRepeat, repeatStartTime);

                // 如果上一次被中斷，需要重新朗讀
                do {
                    wasInterrupted = false;
                    updateStatus(`正在朗讀：${sentence.substring(0, 15)}${sentence.length > 15 ? '...' : ''} (${i}/${sentenceRepeat})`, '');
                    await speakPromise(sentence, lang, selectedVoice, speechRate);
                    
                    // 如果被中斷，等待恢復
                    while (isPaused && !isStopped) {
                        await new Promise(r => setTimeout(r, 200));
                    }
                } while (wasInterrupted && !isStopped);
                
                // 重讀完成後重置跳過等待標記，確保後續正常等待
                skipNextWait = false;

                // 計算剩餘等待時間（等待時間 - 已用朗讀時間）
                const elapsedTime = Date.now() - repeatStartTime;
                const remainingWait = Math.max(0, waitPerRepeat - elapsedTime);

                // 如果還有剩餘時間且不是最後一句的最後一次，則等待
                if (!isStopped && remainingWait > 0 && !(idx === sentences.length - 1 && i === sentenceRepeat)) {
                    await waitRemaining(remainingWait, countdownTimer);
                } else {
                    clearInterval(countdownTimer);
                    updateStatus(document.getElementById('statusReading').textContent, '');
                }
            }
        }
        
        // 確保最後進度條到達 100%
        stopProgressAnimation();
        const progressFill = document.getElementById('progressFill');
        if (progressFill) progressFill.style.width = '100%';
    }

    let currentUtterance = null;
    let isSpeaking = false;  // 標記是否正在朗讀中

    // 根據語言找到最佳匹配的語音（iOS Safari 需要明確指定語音）
    function findBestVoice(lang) {
        if (availableVoices.length === 0) return null;
        
        // iOS 上的語音名稱和語言代碼：
        // 粵語: 善怡 (yue-HK)
        // 普通話: 婷婷 (zh-CN)
        // 台灣: 美佳 (zh-TW)
        
        let voice = null;
        
        if (lang === 'zh-HK') {
            // 粵語：優先用名稱「善怡」匹配
            voice = availableVoices.find(v => v.name === '善怡');
            if (!voice) voice = availableVoices.find(v => v.lang === 'yue-HK');
            if (!voice) voice = availableVoices.find(v => v.lang.includes('yue'));
            if (!voice) voice = availableVoices.find(v => v.lang.includes('HK'));
        } else if (lang === 'zh-CN') {
            // 普通話：優先用名稱「婷婷」匹配
            voice = availableVoices.find(v => v.name === '婷婷');
            if (!voice) voice = availableVoices.find(v => v.lang === 'zh-CN');
            if (!voice) {
                voice = availableVoices.find(v => 
                    v.lang.startsWith('zh') && 
                    !v.lang.includes('yue') && 
                    !v.lang.includes('TW') &&
                    !v.lang.includes('HK') &&
                    v.name !== '善怡' &&
                    v.name !== '美佳'
                );
            }
        } else if (lang === 'en-GB') {
            voice = availableVoices.find(v => v.lang === 'en-GB');
            if (!voice) voice = availableVoices.find(v => v.lang.startsWith('en'));
        } else {
            voice = availableVoices.find(v => v.lang === lang);
            if (!voice) voice = availableVoices.find(v => v.lang.startsWith(lang.split('-')[0]));
        }
        
        console.log(`findBestVoice(${lang}):`, voice ? `${voice.name} (${voice.lang})` : 'null');
        return voice;
    }

    // 將標點符號轉換為可朗讀的文字
    function convertPunctuationToSpeech(text, lang) {
        // 使用省略號作為停頓標記，讓語音合成引擎產生自然停頓
        // 這樣在最後一個字和標點符號朗讀之間會有明顯的停頓感
        const pauseMark = '...';
        
        if (!lang.startsWith('zh')) {
            // 英文標點符號轉換 - 在標點前加入停頓
            return text
                .replace(/，/g, pauseMark + ' comma ')
                .replace(/。/g, pauseMark + ' period ')
                .replace(/！/g, pauseMark + ' exclamation mark ')
                .replace(/？/g, pauseMark + ' question mark ')
                .replace(/；/g, pauseMark + ' semicolon ')
                .replace(/：/g, pauseMark + ' colon ')
                .replace(/、/g, pauseMark + ' pause ')
                .replace(/"/g, pauseMark + ' left quote ')
                .replace(/"/g, pauseMark + ' right quote ')
                .replace(/'/g, pauseMark + ' left single quote ')
                .replace(/'/g, pauseMark + ' right single quote ')
                .replace(/「/g, pauseMark + ' left quote ')
                .replace(/」/g, pauseMark + ' right quote ')
                .replace(/（/g, pauseMark + ' left parenthesis ')
                .replace(/）/g, pauseMark + ' right parenthesis ')
                .replace(/\(/g, pauseMark + ' left parenthesis ')
                .replace(/\)/g, pauseMark + ' right parenthesis ');
        } else {
            // 中文標點符號轉換 - 在標點前加入停頓，讓最後一個字和標點之間有停頓感
            return text
                .replace(/，/g, pauseMark + ' 逗號 ')
                .replace(/。/g, pauseMark + ' 句號 ')
                .replace(/！/g, pauseMark + ' 感嘆號 ')
                .replace(/？/g, pauseMark + ' 問號 ')
                .replace(/；/g, pauseMark + ' 分號 ')
                .replace(/：/g, pauseMark + ' 冒號 ')
                .replace(/、/g, pauseMark + ' 頓號 ')
                .replace(/"/g, pauseMark + ' 左引號 ')
                .replace(/"/g, pauseMark + ' 右引號 ')
                .replace(/'/g, pauseMark + ' 左單引號 ')
                .replace(/'/g, pauseMark + ' 右單引號 ')
                .replace(/「/g, pauseMark + ' 左引號 ')
                .replace(/」/g, pauseMark + ' 右引號 ')
                .replace(/（/g, pauseMark + ' 左括號 ')
                .replace(/）/g, pauseMark + ' 右括號 ')
                .replace(/\(/g, pauseMark + ' 左括號 ')
                .replace(/\)/g, pauseMark + ' 右括號 ');
        }
    }

    function speakPromise(text, lang, voiceName, rate) {
        return new Promise((resolve) => {
            // 先等待暫停狀態結束
            const waitForResume = () => {
                if (isStopped) {
                    resolve();
                    return;
                }
                if (isPaused) {
                    setTimeout(waitForResume, 200);
                    return;
                }
                
                // iOS 26 workaround: 每次朗讀前重新獲取語音列表
                const freshVoices = synth.getVoices();
                if (freshVoices.length > 0) {
                    availableVoices = freshVoices;
                }
                
                // 找到要使用的語音
                let selectedVoice = null;
                
                if (voiceName !== 'auto') {
                    selectedVoice = availableVoices.find(v => v.name === voiceName);
                }
                
                if (!selectedVoice) {
                    selectedVoice = findBestVoice(lang);
                }
                
                // iOS 26 workaround: 先取消所有語音，等待一小段時間
                synth.cancel();
                
                setTimeout(() => {
                    // 轉換標點符號為可朗讀文字
                    const speechText = convertPunctuationToSpeech(text, lang);
                    
                    // 創建新的 utterance
                    const utterance = new SpeechSynthesisUtterance(speechText);
                    utterance.rate = rate;
                    
                    if (selectedVoice) {
                        // iOS 26 workaround: 從新鮮的語音列表中獲取語音對象
                        const freshVoice = availableVoices.find(v => 
                            v.name === selectedVoice.name && v.lang === selectedVoice.lang
                        );
                        
                        const voiceToUse = freshVoice || selectedVoice;
                        
                        // iOS Safari 關鍵修復：必須先設定 voice，再設定 lang
                        utterance.voice = voiceToUse;
                        utterance.lang = voiceToUse.lang;
                        
                        console.log(`Speaking: "${text}" with voice: ${voiceToUse.name} (${voiceToUse.lang})`);
                    } else {
                        utterance.lang = lang;
                        console.log(`No voice found, using lang: ${lang}`);
                    }

                    currentUtterance = utterance;
                    isSpeaking = true;

                    utterance.onend = () => {
                        currentUtterance = null;
                        isSpeaking = false;
                        resolve();
                    };
                    utterance.onerror = (event) => {
                        currentUtterance = null;
                        isSpeaking = false;
                        // 如果是因為暫停而中斷，不顯示錯誤
                        if (event.error === 'interrupted' || event.error === 'canceled') {
                            resolve();
                            return;
                        }
                        console.error('語音合成錯誤:', event.error);
                        const status = document.getElementById('status');
                        if (event.error === 'not-allowed') {
                            status.innerText = '錯誤：請允許語音權限';
                        } else if (event.error === 'network') {
                            status.innerText = '錯誤：網絡連接問題';
                        } else {
                            status.innerText = `朗讀錯誤: ${event.error || '未知錯誤'}`;
                        }
                        resolve();
                    };
                    
                    synth.speak(utterance);
                }, 50); // 短暫延遲讓 cancel 生效
            };
            
            waitForResume();
        });
    }

    function togglePause() {
        const btn = document.getElementById('pauseBtn');
        const pauseText = btn.querySelector('.pause-text');
        const pauseIcon = btn.querySelector('.pause-icon');
        const resumeIcon = btn.querySelector('.resume-icon');
        
        if (!isPaused) {
            isPaused = true;
            // 如果正在朗讀中被中斷，標記需要重新朗讀
            if (isSpeaking) {
                wasInterrupted = true;
            }
            // 直接取消當前語音
            synth.cancel();
            isSpeaking = false;
            pauseText.textContent = "恢復";
            pauseIcon.style.display = 'none';
            resumeIcon.style.display = 'block';
            updateStatus("⏸️ 暫停中", '');
            // 暫停時維持當前高亮 - Requirements 2.4, 4.2
            // HighlightManager 的狀態不需要改變，高亮會自然保持
        } else {
            isPaused = false;
            skipNextWait = true;  // 恢復後跳過等待
            pauseText.textContent = "暫停";
            pauseIcon.style.display = 'block';
            resumeIcon.style.display = 'none';
            // 恢復時繼續正常高亮流程 - Requirements 4.3
            // readWords/readArticle 會繼續執行，高亮會在下一個項目開始時更新
        }
    }

    function resetButtons() {
        setButtonsState(false);
        const btn = document.getElementById('pauseBtn');
        const pauseText = btn.querySelector('.pause-text');
        const pauseIcon = btn.querySelector('.pause-icon');
        const resumeIcon = btn.querySelector('.resume-icon');
        pauseText.textContent = "暫停";
        pauseIcon.style.display = 'block';
        resumeIcon.style.display = 'none';
    }

    function stopReading() {
        isStopped = true;
        isPaused = false;
        wasInterrupted = false;
        skipNextWait = false;
        isSpeaking = false;
        synth.cancel();
        if (window.currentTimer) clearInterval(window.currentTimer);
        resetButtons();
        resetProgress();
        updateStatus("已取消", '');
        
        // 切換回編輯模式，清理高亮狀態 - Requirements 4.1, 6.3
        HighlightManager.switchToEditMode();
    }

    function setButtonsState(running) {
        document.getElementById('startBtn').disabled = running;
        document.getElementById('pauseBtn').disabled = !running;
        document.getElementById('stopBtn').disabled = !running;
    }
    
    // 調試：顯示可用語音
    function showVoiceDebug() {
        const voices = synth.getVoices();
        const debugDiv = document.getElementById('voiceDebug');
        const selectedLang = document.getElementById('langSelect').value;
        
        if (voices.length === 0) {
            debugDiv.textContent = '沒有找到語音，請稍後再試...';
            return;
        }
        
        // 測試 findBestVoice
        const bestVoice = findBestVoice(selectedLang);
        
        let output = `找到 ${voices.length} 個語音\n`;
        output += `當前選擇語言: ${selectedLang}\n`;
        output += `自動選擇語音: ${bestVoice ? `${bestVoice.name} (${bestVoice.lang})` : '無'}\n`;
        if (bestVoice) {
            output += `語音 URI: ${bestVoice.voiceURI}\n`;
        }
        output += '\n';
        
        // 分類顯示
        const zhVoices = voices.filter(v => v.lang.startsWith('zh') || v.lang.includes('yue') || v.lang.includes('cmn'));
        
        output += '=== 中文語音 ===\n';
        zhVoices.forEach(v => {
            const marker = (bestVoice && v.name === bestVoice.name) ? ' ✓ 已選' : '';
            output += `${v.name} (${v.lang}) [${v.voiceURI}]${marker}\n`;
        });
        
        debugDiv.textContent = output;
    }
    
    // 測試語音按鈕
    function testVoice() {
        const selectedLang = document.getElementById('langSelect').value;
        const voice = findBestVoice(selectedLang);
        const testText = selectedLang === 'zh-CN' ? '你好，這是普通話測試' : 
                         selectedLang === 'zh-HK' ? '你好，呢個係粵語測試' : 
                         'Hello, this is a voice test';
        
        // 取消任何正在進行的語音
        synth.cancel();
        
        const utterance = new SpeechSynthesisUtterance(testText);
        
        if (voice) {
            // iOS 26 workaround: 嘗試多種方式設定語音
            utterance.voice = voice;
            utterance.lang = voice.lang;
            
            console.log('Testing voice:', voice.name, voice.lang, voice.voiceURI);
            
            const debugDiv = document.getElementById('voiceDebug');
            debugDiv.textContent += `\n\n=== 測試中 ===\n`;
            debugDiv.textContent += `語音: ${voice.name}\n`;
            debugDiv.textContent += `語言: ${voice.lang}\n`;
            debugDiv.textContent += `URI: ${voice.voiceURI}\n`;
            debugDiv.textContent += `文字: ${testText}\n`;
        }
        
        utterance.rate = 0.9;
        
        utterance.onstart = () => {
            console.log('Speech started');
        };
        
        utterance.onend = () => {
            console.log('Speech ended');
        };
        
        utterance.onerror = (e) => {
            console.error('Speech error:', e.error);
            const debugDiv = document.getElementById('voiceDebug');
            debugDiv.textContent += `錯誤: ${e.error}\n`;
        };
        
        synth.speak(utterance);
    }
    
    // 語言選擇變更時更新調試信息
    document.getElementById('langSelect').addEventListener('change', showVoiceDebug);
    
    // 頁面載入後自動顯示調試信息
    setTimeout(showVoiceDebug, 1000);
</script>
