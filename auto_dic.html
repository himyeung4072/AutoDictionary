<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>詞語重複朗讀器</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; padding: 20px; line-height: 1.6; max-width: 500px; margin: auto; background-color: #f0f2f5; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; margin-top: 0; }
        textarea { width: 100%; height: 150px; margin-bottom: 15px; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .controls > div { display: flex; flex-direction: column; }
        .number-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .number-controls.three-cols { grid-template-columns: 1fr 1fr 1fr; }
        label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; }
        #startBtn { background: #28a745; color: white; }
        #pauseBtn { background: #ffc107; color: #333; }
        #stopBtn { background: #dc3545; color: white; }
        button:disabled { background: #ccc !important; cursor: not-allowed; }
        .status { text-align: center; margin-top: 15px; font-size: 14px; color: #007bff; min-height: 20px; font-weight: bold; }
        .mode-toggle { display: flex; gap: 10px; margin-bottom: 15px; }
        .mode-toggle label { display: flex; align-items: center; gap: 5px; cursor: pointer; font-weight: normal; }
        .mode-toggle input[type="radio"] { width: auto; }
        .hidden { display: none !important; }
        /* 螢幕閱讀器專用隱藏 */
        legend.hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
        
        /* 移動裝置優化 */
        @media (max-width: 520px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            .controls { grid-template-columns: 1fr; }
            .number-controls.three-cols { grid-template-columns: 1fr; }
            button { padding: 14px; font-size: 16px; min-height: 48px; }
            input, select { min-height: 44px; font-size: 16px; }
            textarea { font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>默書神器</h2>
    
    <div class="controls">
        <div>
            <label for="langSelect">選擇語言：</label>
            <select id="langSelect" aria-describedby="langDesc">
                <option value="zh-HK">粵語</option>
                <option value="zh-CN">普通話</option>
                <option value="en-GB">英語</option>
            </select>
        </div>
        <div>
            <label for="voiceSelect">選擇聲音：</label>
            <select id="voiceSelect">
                <option value="auto">自動</option>
            </select>
        </div>
    </div>

    <fieldset class="mode-toggle" style="border:none; padding:0; margin:0 0 15px 0;">
        <legend class="hidden">選擇模式</legend>
        <label><input type="radio" name="mode" value="word" checked onchange="toggleMode()"> 讀詞語</label>
        <label><input type="radio" name="mode" value="article" onchange="toggleMode()"> 讀文章</label>
    </fieldset>

    <label id="inputLabel" for="words">輸入詞語（每行一個）：</label>
    <textarea id="words" placeholder="蘋果&#10;香蕉" aria-labelledby="inputLabel"></textarea>

    <div id="wordControls" class="number-controls three-cols">
        <div>
            <label for="wordSpeechRate">朗讀速度：</label>
            <select id="wordSpeechRate">
                <option value="0.5">很慢</option>
                <option value="0.7">慢</option>
                <option value="0.9" selected>正常</option>
                <option value="1.1">快</option>
                <option value="1.3">很快</option>
            </select>
        </div>
        <div>
            <label for="repeatCount">每行朗讀次數：</label>
            <select id="repeatCount">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3" selected>3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
        </div>
        <div>
            <label for="interval">每詞相隔秒數：</label>
            <select id="interval">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5" selected>5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
            </select>
        </div>
    </div>

    <div id="articleControls" class="number-controls three-cols hidden">
        <div>
            <label for="speechRate">朗讀速度：</label>
            <select id="speechRate">
                <option value="0.5">很慢</option>
                <option value="0.7">慢</option>
                <option value="0.9" selected>正常</option>
                <option value="1.1">快</option>
                <option value="1.3">很快</option>
            </select>
        </div>
        <div>
            <label for="sentenceRepeat">朗讀句子次數：</label>
            <select id="sentenceRepeat">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
        </div>
        <div>
            <label for="charWaitTime">每字等待秒數：</label>
            <select id="charWaitTime">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3" selected>3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
            </select>
        </div>
    </div>

    <div class="btn-group" role="group" aria-label="播放控制">
        <button id="startBtn" onclick="startReading()" aria-label="開始朗讀">開始</button>
        <button id="pauseBtn" onclick="togglePause()" disabled aria-label="暫停朗讀">暫停</button>
        <button id="stopBtn" onclick="stopReading()" disabled aria-label="取消朗讀">取消</button>
    </div>

    <div id="status" class="status" role="status" aria-live="polite"></div>
    
    <details style="margin-top: 15px; font-size: 12px;">
        <summary style="cursor: pointer; color: #666;">調試：查看可用語音</summary>
        <div id="voiceDebug" style="margin-top: 10px; padding: 10px; background: #f5f5f5; border-radius: 6px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; font-family: monospace;"></div>
        <div style="margin-top: 5px; display: flex; gap: 5px;">
            <button onclick="showVoiceDebug()" style="padding: 5px 10px; font-size: 12px;">刷新語音列表</button>
            <button onclick="testVoice()" style="padding: 5px 10px; font-size: 12px; background: #007bff; color: white; border: none; border-radius: 4px;">測試語音</button>
        </div>
        <div style="margin-top: 10px; padding: 10px; background: #fff3cd; border-radius: 6px; font-size: 11px; color: #856404;">
            <strong>iOS 26 已知問題：</strong>Apple 確認 iOS 26 存在語音選擇 bug，系統可能忽略指定的語音設定。<br>
            <strong>臨時解決方案：</strong>請到「設定 → 輔助使用 → 朗讀內容 → 聲音」中，將普通話的預設語音設為「婷婷」。
        </div>
    </details>
</div>

<script>
    // 瀏覽器相容性檢查
    if (!('speechSynthesis' in window)) {
        alert('您的瀏覽器不支援語音合成功能，請使用 Chrome、Edge 或 Safari');
        document.getElementById('startBtn').disabled = true;
    }

    let synth = window.speechSynthesis;
    let isStopped = false;
    let isPaused = false;
    let availableVoices = [];
    let wasInterrupted = false;  // 標記是否在朗讀中被中斷
    let skipNextWait = false;    // 標記是否跳過下一次等待

    // 保存設定到 localStorage
    function saveSettings() {
        const settings = {
            lang: document.getElementById('langSelect').value,
            voice: document.getElementById('voiceSelect').value,
            mode: document.querySelector('input[name="mode"]:checked').value,
            wordSpeechRate: document.getElementById('wordSpeechRate').value,
            repeatCount: document.getElementById('repeatCount').value,
            interval: document.getElementById('interval').value,
            speechRate: document.getElementById('speechRate').value,
            sentenceRepeat: document.getElementById('sentenceRepeat').value,
            charWaitTime: document.getElementById('charWaitTime').value
        };
        localStorage.setItem('dictationSettings', JSON.stringify(settings));
    }

    // 載入設定從 localStorage
    function loadSettings() {
        const saved = localStorage.getItem('dictationSettings');
        if (!saved) return;
        
        try {
            const settings = JSON.parse(saved);
            if (settings.lang) document.getElementById('langSelect').value = settings.lang;
            if (settings.mode) {
                document.querySelector(`input[name="mode"][value="${settings.mode}"]`).checked = true;
                toggleMode();
            }
            if (settings.wordSpeechRate) document.getElementById('wordSpeechRate').value = settings.wordSpeechRate;
            if (settings.repeatCount) document.getElementById('repeatCount').value = settings.repeatCount;
            if (settings.interval) document.getElementById('interval').value = settings.interval;
            if (settings.speechRate) document.getElementById('speechRate').value = settings.speechRate;
            if (settings.sentenceRepeat) document.getElementById('sentenceRepeat').value = settings.sentenceRepeat;
            if (settings.charWaitTime) document.getElementById('charWaitTime').value = settings.charWaitTime;
            
            // 聲音需要在載入後設定
            if (settings.voice) {
                setTimeout(() => {
                    const voiceSelect = document.getElementById('voiceSelect');
                    if ([...voiceSelect.options].some(opt => opt.value === settings.voice)) {
                        voiceSelect.value = settings.voice;
                    }
                }, 500);
            }
        } catch (e) {
            console.error('載入設定失敗:', e);
        }
    }

    // 切換模式
    function toggleMode() {
        const mode = document.querySelector('input[name="mode"]:checked').value;
        const wordControls = document.getElementById('wordControls');
        const articleControls = document.getElementById('articleControls');
        const inputLabel = document.getElementById('inputLabel');
        const textarea = document.getElementById('words');
        
        if (mode === 'word') {
            wordControls.classList.remove('hidden');
            articleControls.classList.add('hidden');
            inputLabel.textContent = '輸入詞語（每行一個）：';
            textarea.placeholder = '蘋果\n香蕉';
        } else {
            wordControls.classList.add('hidden');
            articleControls.classList.remove('hidden');
            inputLabel.textContent = '輸入文章：';
            textarea.placeholder = '今天天氣很好。我們一起去公園玩吧！';
        }
    }

    // 載入可用聲音（含重試機制）
    let voiceLoadRetries = 0;
    const maxVoiceRetries = 10;
    
    function loadVoices() {
        availableVoices = synth.getVoices();
        if (availableVoices.length === 0 && voiceLoadRetries < maxVoiceRetries) {
            voiceLoadRetries++;
            setTimeout(loadVoices, 200);
            return;
        }
        updateVoiceOptions();
    }

    // 檢測是否為 iOS 設備
    function isIOS() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) || 
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    // 更新聲音選項
    function updateVoiceOptions() {
        const langSelect = document.getElementById('langSelect');
        const voiceSelect = document.getElementById('voiceSelect');
        const selectedLang = langSelect.value;
        
        // iOS 26 workaround: 不使用「自動」，直接列出可用語音
        // 因為 iOS 26 會忽略 voice 設定，使用系統預設語音
        const isiOSDevice = isIOS();
        
        if (isiOSDevice) {
            voiceSelect.innerHTML = ''; // iOS 上不提供「自動」選項
        } else {
            voiceSelect.innerHTML = '<option value="auto">自動</option>';
        }
        
        // 根據選擇的語言過濾語音
        let filteredVoices = [];
        
        if (selectedLang === 'zh-HK') {
            // 粵語：iOS 上是 yue-HK
            filteredVoices = availableVoices.filter(voice => 
                voice.lang === 'yue-HK' || 
                voice.lang.includes('yue') ||
                (voice.lang.includes('HK') && !voice.lang.startsWith('en'))
            );
        } else if (selectedLang === 'zh-CN') {
            // 普通話：zh-CN，排除 yue 和 TW
            filteredVoices = availableVoices.filter(voice => 
                voice.lang === 'zh-CN' ||
                (voice.lang.startsWith('zh') && 
                 !voice.lang.includes('yue') && 
                 !voice.lang.includes('TW') &&
                 !voice.lang.includes('HK'))
            );
        } else {
            // 其他語言：按語言前綴過濾
            const langPrefix = selectedLang.split('-')[0];
            filteredVoices = availableVoices.filter(voice => 
                voice.lang.startsWith(langPrefix)
            );
        }
        
        // iOS 26 workaround: 去重複（iOS 可能返回重複的語音）
        const uniqueVoices = [];
        const seenNames = new Set();
        filteredVoices.forEach(voice => {
            if (!seenNames.has(voice.name)) {
                seenNames.add(voice.name);
                uniqueVoices.push(voice);
            }
        });
        
        uniqueVoices.forEach((voice, index) => {
            const option = document.createElement('option');
            option.value = voice.name;
            
            // 識別語音類型
            let label = voice.name;
            const voiceLang = voice.lang.toLowerCase();
            
            // 標記語言類型
            if (voiceLang.includes('yue') || voiceLang === 'zh-hk') {
                label += ' (粵語)';
            } else if (voiceLang === 'zh-cn') {
                label += ' (普通話)';
            } else if (voiceLang === 'zh-tw') {
                label += ' (台灣)';
            }
            
            option.textContent = label;
            voiceSelect.appendChild(option);
        });
        
        // iOS 26 workaround: 如果沒有選項，添加一個提示
        if (voiceSelect.options.length === 0) {
            const option = document.createElement('option');
            option.value = 'auto';
            option.textContent = '無可用語音';
            voiceSelect.appendChild(option);
        }
        
        // iOS: 顯示提示信息
        updateiOSHint();
    }
    
    // 更新 iOS 提示信息
    function updateiOSHint() {
        const isiOSDevice = isIOS();
        let hintDiv = document.getElementById('iosHint');
        
        if (isiOSDevice) {
            if (!hintDiv) {
                hintDiv = document.createElement('div');
                hintDiv.id = 'iosHint';
                hintDiv.style.cssText = 'margin-top: 10px; padding: 10px; background: #e7f3ff; border-radius: 6px; font-size: 12px; color: #0066cc;';
                const controlsDiv = document.querySelector('.controls');
                controlsDiv.parentNode.insertBefore(hintDiv, controlsDiv.nextSibling);
            }
            hintDiv.innerHTML = '<strong>💡 iOS 用戶提示：</strong>請在「選擇聲音」中手動選擇語音（如：婷婷 = 普通話，善怡 = 粵語）';
        } else if (hintDiv) {
            hintDiv.remove();
        }
    }

    if (synth.onvoiceschanged !== undefined) {
        synth.onvoiceschanged = loadVoices;
    }
    
    document.getElementById('langSelect').addEventListener('change', updateVoiceOptions);
    setTimeout(loadVoices, 100);

    // 載入已保存的設定
    loadSettings();

    // 監聽設定變更並自動保存
    document.querySelectorAll('select, input').forEach(el => {
        el.addEventListener('change', saveSettings);
    });



    // 核心等待函數：支援暫停檢查和間隔計時，並顯示倒數
    function wait(ms, status, showCountdown = false) {
        return new Promise(resolve => {
            // 如果需要跳過等待，直接返回
            if (skipNextWait) {
                skipNextWait = false;
                resolve();
                return;
            }
            
            const start = Date.now();
            const timer = setInterval(() => {
                if (isStopped) {
                    clearInterval(timer);
                    resolve();
                } else if (isPaused) {
                    // 暫停時停止計時，恢復後跳過剩餘等待
                    clearInterval(timer);
                    skipNextWait = true;
                    // 等待恢復
                    const waitResume = setInterval(() => {
                        if (isStopped || !isPaused) {
                            clearInterval(waitResume);
                            resolve();
                        }
                    }, 200);
                } else if (!isPaused) {
                    const elapsed = Date.now() - start;
                    if (elapsed >= ms) {
                        clearInterval(timer);
                        resolve();
                    } else if (showCountdown && status) {
                        const remaining = Math.ceil((ms - elapsed) / 1000);
                        status.innerText = `等待中... (${remaining} 秒)`;
                    }
                }
            }, 100);
            window.currentTimer = timer;
        });
    }

    // 分割文章為句子
    function splitIntoSentences(text) {
        const punctuationPattern = /([。！？；，、．.!?;,])/g;
        const parts = text.split(punctuationPattern).filter(s => s.trim() !== '');
        
        const sentences = [];
        for (let i = 0; i < parts.length; i++) {
            let sentence = parts[i].trim();
            if (i + 1 < parts.length && /^[。！？；，、．.!?;,]$/.test(parts[i + 1])) {
                sentence += parts[i + 1];
                i++;
            }
            if (sentence.trim() !== '' && !/^[。！？；，、．.!?;,]$/.test(sentence)) {
                sentences.push(sentence.trim());
            }
        }
        return sentences;
    }

    // 計算等待時間
    function calculateWaitTime(sentence, lang) {
        const charWaitTime = Math.max(0, parseFloat(document.getElementById('charWaitTime').value) || 3);
        if (lang.startsWith('zh')) {
            const charCount = (sentence.match(/[\u4e00-\u9fff\u3400-\u4dbf]/g) || []).length;
            const count = charCount > 0 ? charCount : sentence.length;
            return count * charWaitTime * 1000;
        } else {
            const wordCount = sentence.split(/\s+/).filter(w => w.length > 0).length;
            const count = wordCount > 0 ? wordCount : 1;
            return count * charWaitTime * 1000;
        }
    }

    async function startReading() {
        const mode = document.querySelector('input[name="mode"]:checked').value;
        const text = document.getElementById('words').value;
        const lang = document.getElementById('langSelect').value;
        const selectedVoice = document.getElementById('voiceSelect').value;
        
        if (text.trim() === '') return alert("請輸入內容");

        isStopped = false;
        isPaused = false;
        setButtonsState(true);
        const status = document.getElementById('status');

        try {
            if (mode === 'word') {
                await readWords(text, lang, selectedVoice, status);
            } else {
                await readArticle(text, lang, selectedVoice, status);
            }

            if (!isStopped) {
                status.innerText = "播放完畢";
            }
        } catch (error) {
            console.error('朗讀過程發生錯誤:', error);
            status.innerText = '發生錯誤，請重試';
        }
        resetButtons();
    }

    async function readWords(text, lang, selectedVoice, status) {
        const speechRate = parseFloat(document.getElementById('wordSpeechRate').value) || 0.9;
        const repeatPerLine = Math.max(1, parseInt(document.getElementById('repeatCount').value) || 1);
        const interval = Math.max(0, parseFloat(document.getElementById('interval').value) || 0) * 1000;
        
        const lines = text.split('\n').map(s => s.trim()).filter(s => s !== "");
        if (lines.length === 0) return;

        for (let line of lines) {
            if (isStopped) break;

            for (let i = 1; i <= repeatPerLine; i++) {
                if (isStopped) break;

                // 如果上一次被中斷，需要重新朗讀
                do {
                    wasInterrupted = false;
                    status.innerText = `正在朗讀: ${line} (第 ${i}/${repeatPerLine} 次)`;
                    await speakPromise(line, lang, selectedVoice, speechRate);
                    
                    // 如果被中斷，等待恢復
                    while (isPaused && !isStopped) {
                        await new Promise(r => setTimeout(r, 200));
                    }
                } while (wasInterrupted && !isStopped);
                
                // 重讀完成後重置跳過等待標記，確保後續正常等待
                skipNextWait = false;

                if (!(line === lines[lines.length-1] && i === repeatPerLine)) {
                    await wait(interval, status, true);
                }
            }
        }
    }

    async function readArticle(text, lang, selectedVoice, status) {
        const speechRate = parseFloat(document.getElementById('speechRate').value) || 0.9;
        const sentenceRepeat = Math.max(1, parseInt(document.getElementById('sentenceRepeat').value) || 1);
        
        const sentences = splitIntoSentences(text);
        if (sentences.length === 0) return;

        for (let idx = 0; idx < sentences.length; idx++) {
            const sentence = sentences[idx];
            if (isStopped) break;

            // 計算每次朗讀後的等待時間 = 總等待時間 / 朗讀次數
            const totalWaitTime = calculateWaitTime(sentence, lang);
            const waitPerRepeat = totalWaitTime / sentenceRepeat;

            for (let i = 1; i <= sentenceRepeat; i++) {
                if (isStopped) break;

                // 如果上一次被中斷，需要重新朗讀
                do {
                    wasInterrupted = false;
                    status.innerText = `正在朗讀 (${idx + 1}/${sentences.length}): ${sentence} (第 ${i}/${sentenceRepeat} 次)`;
                    await speakPromise(sentence, lang, selectedVoice, speechRate);
                    
                    // 如果被中斷，等待恢復
                    while (isPaused && !isStopped) {
                        await new Promise(r => setTimeout(r, 200));
                    }
                } while (wasInterrupted && !isStopped);
                
                // 重讀完成後重置跳過等待標記，確保後續正常等待
                skipNextWait = false;

                // 每次朗讀後都等待（最後一句的最後一次不等待）
                if (!isStopped && !(idx === sentences.length - 1 && i === sentenceRepeat)) {
                    await wait(waitPerRepeat, status, true);
                }
            }
        }
    }

    let currentUtterance = null;
    let isSpeaking = false;  // 標記是否正在朗讀中

    // 根據語言找到最佳匹配的語音（iOS Safari 需要明確指定語音）
    function findBestVoice(lang) {
        if (availableVoices.length === 0) return null;
        
        // iOS 上的語音名稱和語言代碼：
        // 粵語: 善怡 (yue-HK)
        // 普通話: 婷婷 (zh-CN)
        // 台灣: 美佳 (zh-TW)
        
        let voice = null;
        
        if (lang === 'zh-HK') {
            // 粵語：優先用名稱「善怡」匹配
            voice = availableVoices.find(v => v.name === '善怡');
            if (!voice) voice = availableVoices.find(v => v.lang === 'yue-HK');
            if (!voice) voice = availableVoices.find(v => v.lang.includes('yue'));
            if (!voice) voice = availableVoices.find(v => v.lang.includes('HK'));
        } else if (lang === 'zh-CN') {
            // 普通話：優先用名稱「婷婷」匹配
            voice = availableVoices.find(v => v.name === '婷婷');
            if (!voice) voice = availableVoices.find(v => v.lang === 'zh-CN');
            if (!voice) {
                voice = availableVoices.find(v => 
                    v.lang.startsWith('zh') && 
                    !v.lang.includes('yue') && 
                    !v.lang.includes('TW') &&
                    !v.lang.includes('HK') &&
                    v.name !== '善怡' &&
                    v.name !== '美佳'
                );
            }
        } else if (lang === 'en-GB') {
            voice = availableVoices.find(v => v.lang === 'en-GB');
            if (!voice) voice = availableVoices.find(v => v.lang.startsWith('en'));
        } else {
            voice = availableVoices.find(v => v.lang === lang);
            if (!voice) voice = availableVoices.find(v => v.lang.startsWith(lang.split('-')[0]));
        }
        
        console.log(`findBestVoice(${lang}):`, voice ? `${voice.name} (${voice.lang})` : 'null');
        return voice;
    }

    function speakPromise(text, lang, voiceName, rate) {
        return new Promise((resolve) => {
            // 先等待暫停狀態結束
            const waitForResume = () => {
                if (isStopped) {
                    resolve();
                    return;
                }
                if (isPaused) {
                    setTimeout(waitForResume, 200);
                    return;
                }
                
                // iOS 26 workaround: 每次朗讀前重新獲取語音列表
                const freshVoices = synth.getVoices();
                if (freshVoices.length > 0) {
                    availableVoices = freshVoices;
                }
                
                // 找到要使用的語音
                let selectedVoice = null;
                
                if (voiceName !== 'auto') {
                    selectedVoice = availableVoices.find(v => v.name === voiceName);
                }
                
                if (!selectedVoice) {
                    selectedVoice = findBestVoice(lang);
                }
                
                // iOS 26 workaround: 先取消所有語音，等待一小段時間
                synth.cancel();
                
                setTimeout(() => {
                    // 創建新的 utterance
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.rate = rate;
                    
                    if (selectedVoice) {
                        // iOS 26 workaround: 從新鮮的語音列表中獲取語音對象
                        const freshVoice = availableVoices.find(v => 
                            v.name === selectedVoice.name && v.lang === selectedVoice.lang
                        );
                        
                        const voiceToUse = freshVoice || selectedVoice;
                        
                        // iOS Safari 關鍵修復：必須先設定 voice，再設定 lang
                        utterance.voice = voiceToUse;
                        utterance.lang = voiceToUse.lang;
                        
                        console.log(`Speaking: "${text}" with voice: ${voiceToUse.name} (${voiceToUse.lang})`);
                        
                        // 更新狀態顯示實際使用的語音
                        const statusEl = document.getElementById('status');
                        const currentStatus = statusEl.innerText;
                        if (!currentStatus.includes('語音:')) {
                            statusEl.innerText = currentStatus + ` [語音: ${voiceToUse.name}]`;
                        }
                    } else {
                        utterance.lang = lang;
                        console.log(`No voice found, using lang: ${lang}`);
                    }

                    currentUtterance = utterance;
                    isSpeaking = true;

                    utterance.onend = () => {
                        currentUtterance = null;
                        isSpeaking = false;
                        resolve();
                    };
                    utterance.onerror = (event) => {
                        currentUtterance = null;
                        isSpeaking = false;
                        // 如果是因為暫停而中斷，不顯示錯誤
                        if (event.error === 'interrupted' || event.error === 'canceled') {
                            resolve();
                            return;
                        }
                        console.error('語音合成錯誤:', event.error);
                        const status = document.getElementById('status');
                        if (event.error === 'not-allowed') {
                            status.innerText = '錯誤：請允許語音權限';
                        } else if (event.error === 'network') {
                            status.innerText = '錯誤：網絡連接問題';
                        } else {
                            status.innerText = `朗讀錯誤: ${event.error || '未知錯誤'}`;
                        }
                        resolve();
                    };
                    
                    synth.speak(utterance);
                }, 50); // 短暫延遲讓 cancel 生效
            };
            
            waitForResume();
        });
    }

    function togglePause() {
        const btn = document.getElementById('pauseBtn');
        const status = document.getElementById('status');
        
        if (!isPaused) {
            isPaused = true;
            // 如果正在朗讀中被中斷，標記需要重新朗讀
            if (isSpeaking) {
                wasInterrupted = true;
            }
            // 直接取消當前語音
            synth.cancel();
            isSpeaking = false;
            btn.innerText = "恢復";
            status.innerText = "暫停中...";
        } else {
            isPaused = false;
            skipNextWait = true;  // 恢復後跳過等待
            btn.innerText = "暫停";
        }
    }

    function resetButtons() {
        setButtonsState(false);
        document.getElementById('pauseBtn').innerText = "暫停";
    }

    function stopReading() {
        isStopped = true;
        isPaused = false;
        wasInterrupted = false;
        skipNextWait = false;
        isSpeaking = false;
        synth.cancel();
        if (window.currentTimer) clearInterval(window.currentTimer);
        resetButtons();
        document.getElementById('status').innerText = "已取消";
    }

    function setButtonsState(running) {
        document.getElementById('startBtn').disabled = running;
        document.getElementById('pauseBtn').disabled = !running;
        document.getElementById('stopBtn').disabled = !running;
    }
    
    // 調試：顯示可用語音
    function showVoiceDebug() {
        const voices = synth.getVoices();
        const debugDiv = document.getElementById('voiceDebug');
        const selectedLang = document.getElementById('langSelect').value;
        
        if (voices.length === 0) {
            debugDiv.textContent = '沒有找到語音，請稍後再試...';
            return;
        }
        
        // 測試 findBestVoice
        const bestVoice = findBestVoice(selectedLang);
        
        let output = `找到 ${voices.length} 個語音\n`;
        output += `當前選擇語言: ${selectedLang}\n`;
        output += `自動選擇語音: ${bestVoice ? `${bestVoice.name} (${bestVoice.lang})` : '無'}\n`;
        if (bestVoice) {
            output += `語音 URI: ${bestVoice.voiceURI}\n`;
        }
        output += '\n';
        
        // 分類顯示
        const zhVoices = voices.filter(v => v.lang.startsWith('zh') || v.lang.includes('yue') || v.lang.includes('cmn'));
        
        output += '=== 中文語音 ===\n';
        zhVoices.forEach(v => {
            const marker = (bestVoice && v.name === bestVoice.name) ? ' ✓ 已選' : '';
            output += `${v.name} (${v.lang}) [${v.voiceURI}]${marker}\n`;
        });
        
        debugDiv.textContent = output;
    }
    
    // 測試語音按鈕
    function testVoice() {
        const selectedLang = document.getElementById('langSelect').value;
        const voice = findBestVoice(selectedLang);
        const testText = selectedLang === 'zh-CN' ? '你好，這是普通話測試' : 
                         selectedLang === 'zh-HK' ? '你好，呢個係粵語測試' : 
                         'Hello, this is a voice test';
        
        // 取消任何正在進行的語音
        synth.cancel();
        
        const utterance = new SpeechSynthesisUtterance(testText);
        
        if (voice) {
            // iOS 26 workaround: 嘗試多種方式設定語音
            utterance.voice = voice;
            utterance.lang = voice.lang;
            
            console.log('Testing voice:', voice.name, voice.lang, voice.voiceURI);
            
            const debugDiv = document.getElementById('voiceDebug');
            debugDiv.textContent += `\n\n=== 測試中 ===\n`;
            debugDiv.textContent += `語音: ${voice.name}\n`;
            debugDiv.textContent += `語言: ${voice.lang}\n`;
            debugDiv.textContent += `URI: ${voice.voiceURI}\n`;
            debugDiv.textContent += `文字: ${testText}\n`;
        }
        
        utterance.rate = 0.9;
        
        utterance.onstart = () => {
            console.log('Speech started');
        };
        
        utterance.onend = () => {
            console.log('Speech ended');
        };
        
        utterance.onerror = (e) => {
            console.error('Speech error:', e.error);
            const debugDiv = document.getElementById('voiceDebug');
            debugDiv.textContent += `錯誤: ${e.error}\n`;
        };
        
        synth.speak(utterance);
    }
    
    // 語言選擇變更時更新調試信息
    document.getElementById('langSelect').addEventListener('change', showVoiceDebug);
    
    // 頁面載入後自動顯示調試信息
    setTimeout(showVoiceDebug, 1000);
</script>
